services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: todo-backend:latest
    container_name: todo-api
    restart: unless-stopped
    # JWT secrets and other settings come from .env (copy .env.example).
    env_file:
      - .env
    environment:
      PORT: 3000
      # Inside the compose network, Postgres is reached by its service name.
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: todo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-todo_db}
    ports:
      # Bound to localhost so the database is not reachable from your network.
      - '127.0.0.1:5432:5432'
    volumes:
      - todo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: todo-pgadmin
    restart: unless-stopped
    environment:
      # Desktop (single-user) mode: no login screen beyond the credentials below.
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-password}
      # Keeps the pgAdmin master password stable between restarts.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '127.0.0.1:5050:80'
    volumes:
      # Persists pgAdmin settings and any servers you add by hand.
      - todo-pgadmin-data:/var/lib/pgadmin
    configs:
      # Pre-registers the Postgres server so it shows up on first launch.
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy

configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "TaskFlow Postgres",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "${DB_NAME}",
            "Username": "${DB_USER}",
            "SSLMode": "prefer"
          }
        }
      }

volumes:
  todo-postgres-data:
    name: todo-postgres-data
  todo-pgadmin-data:
    name: todo-pgadmin-data
